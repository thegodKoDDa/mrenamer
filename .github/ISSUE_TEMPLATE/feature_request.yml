name: Sugerir uma melhoria
description: Proponha uma mudança no aplicativo.
title: "[Melhoria] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual necessidade a melhoria resolve?
      description: Descreva um exemplo de uso.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Comportamento proposto
      description: Explique o resultado desejado e eventuais alternativas.
    validations:
      required: true
