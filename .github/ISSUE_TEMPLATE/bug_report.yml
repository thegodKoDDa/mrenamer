name: Relatar um problema
description: Descreva um erro e como reproduzi-lo com arquivos fictícios.
title: "[Erro] "
body:
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Explique o resultado esperado e o que o aplicativo fez.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir
      description: Informe os passos e exemplos fictícios de nomes, sem mídia ou caminhos pessoais.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Versão do Windows e, ao executar pelo código, versão do Python e commit utilizado.
      placeholder: Windows 11, Python 3.13, commit…
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Mensagem de erro
      description: Copie a mensagem, se houver, removendo informações pessoais.
