name: Publicar versão Windows

on:
  push:
    branches: [main]
    paths:
      - 'renamer/Renomeador_de_Midia_Projeto/**'
      - 'renamer final/GUIA_DO_USUARIO.txt'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  linux:
    name: Validar motor no Linux
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk
      - run: /usr/bin/python3 -m unittest discover -s tests -v
      - run: /usr/bin/python3 -m unittest discover -s scripts -p 'test_*.py' -v

  release:
    name: Compilar, conferir e publicar
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar caminhos temporários completos
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "MRENAMER_RELEASE_DIR=$env:RUNNER_TEMP\mrenamer-release" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Instalar ambiente fixado de build
        run: python -m pip install -r renamer/Renomeador_de_Midia_Projeto/requirements-build.txt
      - name: Testar, compilar e abrir o executável
        run: python scripts/build_windows.py
      - name: Preparar EXE, ZIP, manifesto e hashes
        run: python scripts/package_release.py --output "$env:MRENAMER_RELEASE_DIR" --commit "$env:GITHUB_SHA"
      - name: Publicar somente depois de conferir os assets remotos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Reexecutar um job antigo não pode promover fontes já substituídas.
          git fetch origin main --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao conferir a main atual.' }
          git diff --quiet "$env:GITHUB_SHA" FETCH_HEAD -- renamer/Renomeador_de_Midia_Projeto 'renamer final/GUIA_DO_USUARIO.txt' tests scripts .github/workflows
          if ($LASTEXITCODE -ne 0) { throw 'Há alterações mais recentes da distribuição em main. Publique a execução atual.' }
          $tag = "build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT-$($env:GITHUB_SHA.Substring(0,8))"
          $assets = @('MediaRenamer.exe', 'MediaRenamer-Windows-x64.zip', 'build-manifest.json', 'SHA256SUMS.txt') | ForEach-Object { Join-Path $env:MRENAMER_RELEASE_DIR $_ }
          gh release create $tag @assets --target "$env:GITHUB_SHA" --title "mrenamer · Windows · $tag" --notes-file "$env:MRENAMER_RELEASE_DIR\release-notes.md" --draft
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar a release em rascunho.' }
          $download = Join-Path $env:RUNNER_TEMP 'mrenamer-release-verify'
          gh release download $tag --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar os assets do rascunho.' }
          python scripts/package_release.py --verify-dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Os assets remotos não passaram na conferência.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a release validada.' }
