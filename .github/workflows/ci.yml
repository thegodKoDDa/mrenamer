name: Verificações

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Motor e continuidade · Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk
      - name: Testar o aplicativo
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Testar continuidade
        run: /usr/bin/python3 -m unittest discover -s scripts -p 'test_*.py' -v

  windows:
    name: Motor e interface · Windows
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      # O TEMP padrão da imagem pode usar um alias DOS 8.3 (RUNNER~1).
      # As fixtures de recuperação exigem caminhos completos, sem aliases.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Instalar dependências
        run: python -m pip install -r renamer/Renomeador_de_Midia_Projeto/requirements.txt
      - name: Testar o aplicativo e a interface
        run: python -m unittest discover -s tests -v
      - name: Testar continuidade
        run: python -m unittest discover -s scripts -p "test_*.py" -v
